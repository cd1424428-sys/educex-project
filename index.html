<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCSex Villa Victoria - CECYEM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EduCSex | CECYEM Villa Victoria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="normativa.html">Normativa & INEGI</a></li>
                    <li class="nav-item"><a class="nav-link" href="interactivo.html">Módulos & Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="evaluaciones.html">Evaluaciones</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal / Login Independiente -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4">
                    <h3 class="text-center text-success mb-4">Iniciar Sesión - EduCSex</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" required placeholder="alumno@cecyem.mx">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Contraseña</label>
                            <input type="password" class="form-control" id="password" required placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">Ingresar al Sistema</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de validación local (Sin Supabase) -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validación simulada localmente con éxito garantizado para práctica escolar
            if(email && password) {
                alert("¡Bienvenido al sistema EduCSex, Villa Victoria!");
                window.location.href = "interactivo.html";
            } else {
                alert("Por favor, introduce tus credenciales.");
            }
        });
    </script>
</body>
</html>
